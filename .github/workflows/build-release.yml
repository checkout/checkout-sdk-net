name: build-release

# Runs on a push to master that changes Directory.Build.props. Only a release commit publishes:
# its first line is "Release <version>" or starts with "Release <version> " (the /release PR
# title), where <version> is the one Directory.Build.props declares. A first line that starts
# with "Release" but names another version fails the run. Any other push builds and tests only.
# A version already on nuget.org is not pushed again. To finish a release that failed part way
# (one package pushed, or the GitHub release not created), re-run that same run: a later push is
# not the release commit of that version, so it does not publish or create the release.
#
#   build    no secrets; locked restore; pack; verify-packages.ps1 and sha256 in one step; artifact
#   test     integration secrets only; locked restore; dotnet test (all target frameworks)
#   publish  environment "nuget", id-token: write only, no secret; no checkout, no restore, no repository
#            code; pushes the artifact only after its sha256 matches the build job's, with a
#            short-lived key from nuget.org trusted publishing (OIDC, policy bound to this
#            repository, build-release.yml and environment "nuget")
#   release  contents: write; gh release create
on:
  push:
    branches:
      - master
    paths:
      - Directory.Build.props

permissions:
  contents: read

# One run at a time. GitHub keeps one pending run per group: a newer push cancels a pending one.
# A cancelled release run publishes nothing, even when the newer push carries its version, since
# that push is not the release commit; the build job then warns that the version is not on
# nuget.org. Re-run the cancelled run (re-runs use its original commit).
concurrency:
  group: build-release
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/../nuget-packages # fresh per job, checked by check-lockfiles.sh after
  MSBUILDDISABLENUGETSDKRESOLVER: '1' # no MSBuild project SDK from NuGet

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_commit: ${{ steps.version.outputs.release_commit }}
      nuget_state: ${{ steps.published.outputs.nuget_state }}
      release_exists: ${{ steps.release-exists.outputs.release_exists }}
      sdk_sha256: ${{ steps.hashes.outputs.sdk_sha256 }}
      extensions_sha256: ${{ steps.hashes.outputs.extensions_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-net
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - id: version
        name: Read and validate the version
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          sdk="$(dotnet msbuild src/CheckoutSdk/CheckoutSdk.csproj -getProperty:Version)"
          extensions="$(dotnet msbuild src/CheckoutSdk.Extensions/CheckoutSdk.Extensions.csproj -getProperty:Version)"
          if [ "$sdk" != "$extensions" ]; then
            echo "::error::The two packages declare different versions"
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$'
          if ! [[ "$sdk" =~ $semver ]]; then
            echo "::error::Version in Directory.Build.props is not MAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          # The evaluated version must be the literal one: an empty or computed <Version> would
          # otherwise evaluate to the SDK default 1.0.0 or to whatever the expression yields.
          if [ "$(grep -cF "<Version>$sdk</Version>" Directory.Build.props)" != 1 ]; then
            echo "::error::Directory.Build.props must declare <Version>$sdk</Version> literally, once"
            exit 1
          fi
          prerelease=false
          case "$sdk" in *-*) prerelease=true ;; esac
          # Only the release commit of this version publishes (see the top of this file).
          message="${HEAD_MESSAGE:-}"
          subject="${message%%$'\n'*}"
          release_commit=false
          case "$subject" in
            "Release $sdk" | "Release $sdk "*) release_commit=true ;;
            [Rr][Ee][Ll][Ee][Aa][Ss][Ee] | [Rr][Ee][Ll][Ee][Aa][Ss][Ee][[:space:]]*)
              echo "::error::The commit looks like a release but is not \"Release $sdk\" (the version in Directory.Build.props)"
              exit 1
              ;;
          esac
          {
            echo "version=$sdk"
            echo "prerelease=$prerelease"
            echo "release_commit=$release_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Version $sdk (pre-release: $prerelease, release commit: $release_commit)"
          if [ "$release_commit" = false ]; then
            echo "::notice::Not a release commit for $sdk: build and test only, nothing is published"
          fi
      - id: published
        name: Check nuget.org for this version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
        run: |
          set -euo pipefail
          wanted="$(tr '[:upper:]' '[:lower:]' <<< "$VERSION")"
          found=0
          for id in checkoutsdk checkoutsdk.extensions.microsoft; do
            index="$RUNNER_TEMP/$id-index.json"
            code="$(curl -sS --retry 3 -o "$index" -w '%{http_code}' "https://api.nuget.org/v3-flatcontainer/$id/index.json")" || code=000
            if [ "$code" != 200 ]; then
              echo "::error::nuget.org lookup for $id failed (HTTP $code)"
              exit 1
            fi
            if ! hit="$(jq -r --arg v "$wanted" 'if (.versions | type) == "array" then (.versions | index($v) != null) else error("no versions") end' "$index" 2> /dev/null)" \
              || { [ "$hit" != true ] && [ "$hit" != false ]; }; then
              echo "::error::nuget.org returned an unexpected response for $id"
              exit 1
            fi
            if [ "$hit" = true ]; then
              found=$((found + 1))
            fi
          done
          # none: publish both. partial: one package is missing (an interrupted publish, or
          # nuget.org still indexing); publish pushes it and skips the one already there. all:
          # nothing to push.
          case "$found" in
            0) state=none ;;
            1) state=partial; echo "::warning::Only one of the two packages has $VERSION on nuget.org" ;;
            2) state=all; echo "::notice::$VERSION is already on nuget.org; nothing to push" ;;
          esac
          if [ "${RELEASE_COMMIT:-}" != true ] && [ "$state" != all ]; then
            echo "::warning::$VERSION is not fully on nuget.org and this push is not its release commit: if its release run was cancelled or failed, re-run that run"
          fi
          echo "nuget_state=$state" >> "$GITHUB_OUTPUT"
      - id: release-exists
        name: Check for the GitHub release of this version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          code="$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")" || code=000
          case "$code" in
            200) exists=true ;;
            404) exists=false ;;
            *) echo "::error::GitHub release lookup for $VERSION failed (HTTP $code)"; exit 1 ;;
          esac
          echo "release_exists=$exists" >> "$GITHUB_OUTPUT"
      - id: lockfiles-present
        run: bash .github/scripts/check-lockfiles.sh before
      - id: restore
        run: bash .github/scripts/check-lockfiles.sh restore
      - id: lockfiles-unchanged
        run: bash .github/scripts/check-lockfiles.sh after
      - id: pack
        # No build server or reused MSBuild node outlives this step.
        run: dotnet pack --no-restore --disable-build-servers --configuration Release --output "$RUNNER_TEMP/package"
      - id: packages-locked-after-pack
        run: bash .github/scripts/check-lockfiles.sh after
      - id: hashes
        name: Verify the packages and record their sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pwsh -NoProfile -NonInteractive -File .github/scripts/verify-packages.ps1 -Version "$VERSION" -Directory "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          sdk="$(sha256sum "CheckoutSDK.$VERSION.nupkg" | cut -d' ' -f1)"
          extensions="$(sha256sum "CheckoutSDK.Extensions.Microsoft.$VERSION.nupkg" | cut -d' ' -f1)"
          echo "sdk_sha256=$sdk" >> "$GITHUB_OUTPUT"
          echo "extensions_sha256=$extensions" >> "$GITHUB_OUTPUT"
          echo "CheckoutSDK.$VERSION.nupkg sha256 $sdk"
          echo "CheckoutSDK.Extensions.Microsoft.$VERSION.nupkg sha256 $extensions"
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 7

  test:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: setup-net-2_0-3_1-5_0-6_0-8_0-10_0
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            2.0.x
            3.1.x
            5.0.x
            6.0.x
            8.0.x
            10.0.x
      - id: list-installed-runtimes
        run: dotnet --list-runtimes
      - id: lockfiles-present
        run: bash .github/scripts/check-lockfiles.sh before
      - id: restore
        run: bash .github/scripts/check-lockfiles.sh restore
      - id: lockfiles-unchanged
        run: bash .github/scripts/check-lockfiles.sh after
      - id: build-solution
        run: dotnet build --no-restore
      - id: test-solution
        env:
          CHECKOUT_PROCESSING_CHANNEL_ID: ${{ secrets.IT_CHECKOUT_PROCESSING_CHANNEL_ID }}
          CHECKOUT_PREVIOUS_SECRET_KEY: ${{ secrets.IT_CHECKOUT_PREVIOUS_SECRET_KEY }}
          CHECKOUT_PREVIOUS_PUBLIC_KEY: ${{ secrets.IT_CHECKOUT_PREVIOUS_PUBLIC_KEY }}
          CHECKOUT_DEFAULT_SECRET_KEY: ${{ secrets.IT_CHECKOUT_DEFAULT_SECRET_KEY }}
          CHECKOUT_DEFAULT_PUBLIC_KEY: ${{ secrets.IT_CHECKOUT_DEFAULT_PUBLIC_KEY }}
          CHECKOUT_DEFAULT_OAUTH_CLIENT_ID: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_CLIENT_ID }}
          CHECKOUT_DEFAULT_OAUTH_CLIENT_SECRET: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_CLIENT_SECRET }}
          CHECKOUT_DEFAULT_OAUTH_PAYOUT_SCHEDULE_CLIENT_ID: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_PAYOUT_SCHEDULE_CLIENT_ID }}
          CHECKOUT_DEFAULT_OAUTH_PAYOUT_SCHEDULE_CLIENT_SECRET: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_PAYOUT_SCHEDULE_CLIENT_SECRET }}
          CHECKOUT_DEFAULT_OAUTH_ACCOUNTS_CLIENT_ID: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_ACCOUNTS_CLIENT_ID }}
          CHECKOUT_DEFAULT_OAUTH_ACCOUNTS_CLIENT_SECRET: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_ACCOUNTS_CLIENT_SECRET }}
          CHECKOUT_DEFAULT_OAUTH_ISSUING_CLIENT_ID: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_ISSUING_CLIENT_ID }}
          CHECKOUT_DEFAULT_OAUTH_ISSUING_CLIENT_SECRET: ${{ secrets.IT_CHECKOUT_DEFAULT_OAUTH_ISSUING_CLIENT_SECRET }}
          CHECKOUT_MERCHANT_SUBDOMAIN: ${{ secrets.IT_CHECKOUT_MERCHANT_SUBDOMAIN }}
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: 1
        run: dotnet test --no-build -p:TestTfmsInParallel=false
      - id: packages-locked-after-test
        run: bash .github/scripts/check-lockfiles.sh after

  publish:
    needs: [build, test]
    if: needs.build.outputs.release_commit == 'true' && needs.build.outputs.nuget_state != 'all'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write # OIDC token for nuget.org trusted publishing
    steps:
      - id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: ${{ runner.temp }}/package
      - id: verify
        name: Verify the artifact is the one the build job produced
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SDK_SHA256: ${{ needs.build.outputs.sdk_sha256 }}
          EXTENSIONS_SHA256: ${{ needs.build.outputs.extensions_sha256 }}
        run: |
          set -euo pipefail
          if [ ! -d "$RUNNER_TEMP/package" ] || [ -L "$RUNNER_TEMP/package" ]; then
            echo "::error::The packages artifact is missing"
            exit 1
          fi
          # The build job validated the version; this only keeps it a plain token in file names.
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Invalid version from the build job"
            exit 1
          fi
          for sha in "$SDK_SHA256" "$EXTENSIONS_SHA256"; do
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid sha256 from the build job"
              exit 1
            fi
          done
          cd "$RUNNER_TEMP/package"
          expected="$(printf '%s\n' "CheckoutSDK.$VERSION.nupkg" "CheckoutSDK.Extensions.Microsoft.$VERSION.nupkg" | LC_ALL=C sort)"
          actual="$(find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::The artifact must hold exactly the two packages of $VERSION"
            exit 1
          fi
          while IFS= read -r file; do
            if [ ! -f "$file" ] || [ -L "$file" ]; then
              echo "::error::$file is not a regular file"
              exit 1
            fi
          done <<< "$expected"
          printf '%s  %s\n' \
            "$SDK_SHA256" "CheckoutSDK.$VERSION.nupkg" \
            "$EXTENSIONS_SHA256" "CheckoutSDK.Extensions.Microsoft.$VERSION.nupkg" \
            | sha256sum --strict --check -
      - id: publish-package
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # nuget.org user name of whoever created the trusted publishing policy (not a secret).
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::Variable NUGET_USER (the nuget.org user who created the trusted publishing policy) is not set"
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token available: the publish job needs permissions id-token: write"
            exit 1
          fi
          # nuget.org trusted publishing, as NuGet/login does it: exchange this job's OIDC token
          # (audience https://www.nuget.org) for a short-lived API key. The key lives only in this
          # step's shell; nothing is written to disk, to GITHUB_ENV or to GITHUB_OUTPUT.
          audience="$(jq -rn --arg a 'https://www.nuget.org' '$a | @uri')"
          if ! oidc_response="$(curl -sS --fail --retry 3 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience")"; then
            echo "::error::Could not get an OIDC token from GitHub"
            exit 1
          fi
          oidc="$(jq -r '.value // empty' <<< "$oidc_response" 2> /dev/null || true)"
          unset oidc_response
          if [ -z "$oidc" ]; then
            echo "::error::GitHub returned no OIDC token"
            exit 1
          fi
          echo "::add-mask::$oidc"
          request="$(jq -cn --arg u "$NUGET_USER" '{username: $u, tokenType: "ApiKey"}')"
          if ! exchange="$(curl -sS --retry 3 -X POST https://www.nuget.org/api/v2/token \
            -H "Authorization: Bearer $oidc" -H 'Content-Type: application/json' \
            -H 'User-Agent: checkout-sdk-net-release' --data "$request" -w '\n%{http_code}')"; then
            echo "::error::nuget.org trusted publishing token exchange failed (network)"
            exit 1
          fi
          unset oidc
          code="${exchange##*$'\n'}"
          body="${exchange%$'\n'*}"
          unset exchange
          if [ "$code" != 200 ]; then
            reason="$(jq -r '.error // empty' <<< "$body" 2> /dev/null || true)"
            echo "::error::nuget.org trusted publishing token exchange failed (HTTP $code) ${reason:+: $reason}. Check the policy on nuget.org (repository, build-release.yml, environment nuget) and NUGET_USER"
            exit 1
          fi
          api_key="$(jq -r '.apiKey // empty' <<< "$body" 2> /dev/null || true)"
          unset body
          if [ -z "$api_key" ]; then
            echo "::error::nuget.org returned no API key"
            exit 1
          fi
          echo "::add-mask::$api_key"
          package_dir="$RUNNER_TEMP/package"
          # Run from an empty directory: no nuget.config or global.json but the runner's own.
          cd "$(mktemp -d)"
          # CheckoutSDK first: the extensions package depends on it. --skip-duplicate completes a
          # partial publish: the package already on nuget.org is skipped, the missing one pushed.
          for file in "CheckoutSDK.$VERSION.nupkg" "CheckoutSDK.Extensions.Microsoft.$VERSION.nupkg"; do
            dotnet nuget push "$package_dir/$file" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$api_key" \
              --skip-duplicate
          done

  release:
    # Also runs when publish was skipped because both packages are already on nuget.org, so a
    # release that failed after its packages were published is created by the next run.
    needs: [build, test, publish]
    if: >-
      always() &&
      needs.build.result == 'success' && needs.test.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      needs.build.outputs.release_commit == 'true' &&
      needs.build.outputs.release_exists == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - id: release-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # The build job validated the version; this only keeps it a plain token.
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Invalid version from the build job"
            exit 1
          fi
          # gh reuses an existing tag and ignores --target, so a tag on another commit is refused.
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$VERSION")"
          ref="$(jq -c --arg r "refs/tags/$VERSION" 'map(select(.ref == $r)) | first // empty' <<< "$refs")"
          if [ -n "$ref" ]; then
            sha="$(jq -r '.object.sha' <<< "$ref")"
            if [ "$(jq -r '.object.type' <<< "$ref")" = tag ]; then
              sha="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq '.object.sha')"
            fi
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $VERSION already exists on another commit"
              exit 1
            fi
          fi
          args=(--target "$GITHUB_SHA")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" "${args[@]}" --title "$VERSION" --notes "${NOTES:-$VERSION}"
